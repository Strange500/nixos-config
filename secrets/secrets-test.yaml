# secrets-test.yaml — FAKE secrets for nixosTest only.
#
# Plain YAML on purpose. Fed to sops-nix with `sops.validateSopsFiles = false`
# so a test VM can decrypt "secrets" without the real age key. Every value is a
# placeholder; this file MUST NOT carry real credentials. Keep the top-level
# key tree in lockstep with the real `secrets/secrets.yaml` (a new `sops.secrets`
# in a module should land here too, or that service's test will fail to decrypt).

github_token: "ghp_test_000000000000000000000000000000000000"

git:
  ssh:
    private: "-----BEGIN OPENSSH PRIVATE KEY-----\ntest\n-----END OPENSSH PRIVATE KEY-----\n"

ssh:
  private: "-----BEGIN OPENSSH PRIVATE KEY-----\ntest\n-----END OPENSSH PRIVATE KEY-----\n"

firefox:
  certFilePKCS12.p12: "pkcs12-placeholder"

networking:
  eduroam:
    identity: "test@example.org"
    password: "test"

