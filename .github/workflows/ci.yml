name: NixOS CI

on:
  pull_request:
  push:
    branches: [main]
  # Auto-bumps push with GITHUB_TOKEN -> GitHub suppresses their push events (anti-recursion),
  # so push:main alone never validates them. Chain on completion instead.
  workflow_run:
    workflows: [Daily Nix Flake Update, Daily Container Image Update]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  sops-activation:
    name: SOPS activation (mount ordering)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Check SOPS with and without a persist mount
        run: nix build .#checks.x86_64-linux.sopsActivationTest --no-link --print-build-logs

  job-dashboard:
    name: Job dashboard (HTTP + Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: HTTP regression tests
        run: python3 -m unittest discover -s home/job-dashboard -v
      - name: Install browser test tools (test-only dependencies)
        run: |
          npm install --prefix "$RUNNER_TEMP/job-dashboard" playwright@1.65.0
          "$RUNNER_TEMP/job-dashboard/node_modules/.bin/playwright" install --with-deps chromium
      - name: Chromium user flows and responsive layouts
        run: NODE_PATH="$RUNNER_TEMP/job-dashboard/node_modules" node home/job-dashboard/test_browser.cjs

  hermes-webui:
    name: Hermes WebUI (native module + HTTP smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Check the native WebUI integration in isolation
        run: nix build .#checks.x86_64-linux.hermesWebuiTest .#checks.x86_64-linux.hermesWebuiFirewallTest --no-link --print-build-logs

  tests:
    name: Flake check (nixosTests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v14
        with:
          name: strange500
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run Nix tests
        run: nix flake check --show-trace --print-build-logs

  # Build every x86_64 host toplevel, verifying the configs (incl. android SDK) build.
  build:
    name: Build ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [Server, Clovis, Cube, Septimius, Clotaire, installer]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v14
        with:
          name: strange500
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The GH-hosted runner only has ~14GB free; building android-studio-full's
      # SDK system images (arm64 + x86_64) blows the disk. Free the preinstalled bloat
      # so the nix-built android images fit.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          df -h

      - name: Build ${{ matrix.host }}
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --show-trace
