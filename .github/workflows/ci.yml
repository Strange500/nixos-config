name: NixOS CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Flake check (nixosTests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v14
        with:
          name: strange500
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run Nix tests
        run: nix flake check --show-trace --print-build-logs

  # Build every x86_64 host toplevel, verifying the configs (incl. android SDK) build.
  build:
    name: Build ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [Server, Clovis, Cube, Septimius, Clotaire, installer]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v14
        with:
          name: strange500
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The GH-hosted runner only has ~14GB free; building android-studio-full's
      # SDK system images (arm64 + x86_64) blows the disk. Free the preinstalled bloat
      # so the nix-built android images fit.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          df -h

      - name: Build ${{ matrix.host }}
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --show-trace