name: Nix Eval Warnings

# Lightweight job that evaluates every host (and home-manager user) and
# collects warnings emitted during evaluation. Pure `nix eval` (no builds),
# so it's cheap. The job FAILS when any warning is present so the failure
# is visible in the Actions list and easy for a monitor to detect.
#
# Triggered:
#   - daily (06:00 UTC) — after the "Daily Nix Flake Update" bot bumps nixpkgs,
#     catching new deprecation/rename warnings introduced by the bump
#   - on push to main touching the flake or any .nix file
#   - manually (`workflow_dispatch`)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - "flake.lock"
      - "**/*.nix"
      - ".github/workflows/nix-warnings.yml"
  # Also run on PRs so a warning-fix branch is evaluated and the check stays
  # red until the warnings are gone (self-validating fix loop).
  pull_request:

jobs:
  eval:
    name: Collect eval warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate all hosts & home-manager configs
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/ev
          # nixosConfigurations (x86_64 hosts + arm pi) and homeConfigurations.
          # Evaluating the toplevel drvPath forces full option evaluation,
          # which is what surfaces eval-time warnings. Parallel for speed.
          evaluate() {
            local target="$1" name="$2"
            nix eval --raw "$target" 2>"/tmp/ev/$name.err" \
              >"/tmp/ev/$name.drv"
            local rc=$?
            echo "eval [$name] rc=$rc"
          }
          evaluate ".#nixosConfigurations.Server.config.system.build.toplevel.drvPath" Server &
          evaluate ".#nixosConfigurations.Clovis.config.system.build.toplevel.drvPath" Clovis &
          evaluate ".#nixosConfigurations.Cube.config.system.build.toplevel.drvPath" Cube &
          evaluate ".#nixosConfigurations.Septimius.config.system.build.toplevel.drvPath" Septimius &
          evaluate ".#nixosConfigurations.Clotaire.config.system.build.toplevel.drvPath" Clotaire &
          evaluate ".#nixosConfigurations.installer.config.system.build.toplevel.drvPath" installer &
          evaluate ".#nixosConfigurations.pi.config.system.build.toplevel.drvPath" pi &
          wait

      - name: Aggregate warnings
        shell: bash
        run: |
          set -uo pipefail
          : > /tmp/warnings.txt
          : > /tmp/eval-errors.txt
          for f in /tmp/ev/*.err; do
            host="$(basename "$f" .err)"
            # A host whose eval errored (not warned) also shows up here; its
            # .drv will be empty. Report those as eval errors below.
            if [ ! -s "/tmp/ev/$host.drv" ]; then
              echo "::group::[EVAL-ERROR] $host (no drv produced)"
              # head FIRST: `sed ... | head` makes sed die on SIGPIPE, and the
              # Actions shell runs with -o pipefail, so the step aborted mid-loop
              # and uploaded an EMPTY warnings artifact (2026-10-26).
              head -n 40 "$f" | sed 's/^/    /'
              echo "::endgroup::"
              # Keep eval errors in the artifact so a red run is diagnosable from
              # the download alone (checked by the gate step below).
              {
                echo "[$host] EVAL-ERROR:"
                grep -m3 -E '^ *error:' "$f" | sed 's/^ *//' || echo "  (no 'error:' line captured, see job log)"
              } >> /tmp/eval-errors.txt
            fi
            # Prefix each warning with its host so fixes can be attributed to
            # the right configuration (a warning on one host vs. all hosts).
            grep -hE 'warning:' "$f" | sed -E "s/^/[$host] /" >> /tmp/warnings.txt || true
          done
          sort -u /tmp/warnings.txt -o /tmp/warnings.txt
          printf '=== WARNING COUNT === %s\n' "$(wc -l </tmp/warnings.txt)"
          if [ -s /tmp/eval-errors.txt ]; then
            echo "::group::Evaluation errors"
            cat /tmp/eval-errors.txt
            echo "::endgroup::"
          fi

      - name: Show warnings
        shell: bash
        run: |
          if [ -s /tmp/warnings.txt ]; then
            echo "::group::Evaluation warnings"
            cat /tmp/warnings.txt
            echo "::endgroup::"
          else
            echo "No warnings."
          fi

      - name: Upload warnings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warnings
          path: |
            /tmp/warnings.txt
            /tmp/eval-errors.txt
          if-no-files-found: ignore

      - name: Fail on evaluation errors
        shell: bash
        run: |
          # An eval error produces no warnings for that host, so without this
          # check a broken host would sail through as "clean".
          if [ -s /tmp/eval-errors.txt ]; then
            echo "::error::Nix evaluation ERRORS (host(s) did not evaluate). See artifact eval-errors.txt."
            exit 1
          fi
          echo "No eval errors."

      - name: Fail when warnings are present
        shell: bash
        run: |
          # Known upstream Jovian/SteamOS warnings that come from the overlay
          # (outside our tree) — tolerated so the gate stays green on Cube.
          # ANY other/new warning still fails the job.
          grep -vE "renamed to/replaced by 'stdenv.hostPlatform.system'|mesa\.drivers. is deprecated, use .mesa.|services\.avahi\.publish\.(enable|userServices). is obsolete" \
            /tmp/warnings.txt > /tmp/warnings.filtered || true
          if [ -s /tmp/warnings.filtered ]; then
            echo "::error::Nix evaluation produced warnings. Inspect the 'warnings' artifact and fix them."
            exit 1
          fi
          echo "Clean evaluation: no warnings."
