name: Daily Container Image Update

on:
  schedule:
    # Daily, 30 min after "Daily Nix Flake Update" (02:00). No-op when nothing moved.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo

      - name: Refresh pinned image digests + hashes
        run: python3 scripts/update-container-images.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- modules/server/images.nix; then
            echo "No image updates."
            exit 0
          fi
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add modules/server/images.nix
          git commit -m "chore(images): bump container image digests - $(date +'%Y-%m-%d')"
          git push
